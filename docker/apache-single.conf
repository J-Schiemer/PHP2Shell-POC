# php2shell lab: one prefork worker, no keep-alive.
# Loaded from /etc/apache2/conf-enabled after docker-php.conf.
KeepAlive Off
ServerName localhost

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
